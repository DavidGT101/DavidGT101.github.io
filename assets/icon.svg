<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <!-- Background Gradient -->
    <radialGradient id="bgGrad" cx="50%" cy="40%" r="65%">
      <stop offset="0%" stop-color="#1c202a" />
      <stop offset="70%" stop-color="#0a0c10" />
      <stop offset="100%" stop-color="#050608" />
    </radialGradient>

    <!-- Outer Rim Metallic Gradient -->
    <linearGradient id="rimGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#3a4050" />
      <stop offset="50%" stop-color="#1f232b" />
      <stop offset="100%" stop-color="#121418" />
    </linearGradient>

    <!-- Red Light Bar Glow -->
    <linearGradient id="redBar" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#ff4d4d" />
      <stop offset="50%" stop-color="#ff0000" />
      <stop offset="100%" stop-color="#b30000" />
    </linearGradient>

    <!-- Amber Indicator Glow -->
    <linearGradient id="amberBar" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#ffc04d" />
      <stop offset="50%" stop-color="#ff9900" />
      <stop offset="100%" stop-color="#cc7a00" />
    </linearGradient>

    <filter id="glowRed" x="-20%" y="-40%" width="140%" height="180%">
      <feGaussianBlur stdDeviation="10" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>

    <filter id="glowAmber" x="-20%" y="-40%" width="140%" height="180%">
      <feGaussianBlur stdDeviation="12" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Base App Tile with Smooth Rounded Corners -->
  <rect x="24" y="24" width="464" height="464" rx="100" fill="url(#bgGrad)" stroke="url(#rimGrad)" stroke-width="8" />

  <!-- Inner Subtle Bevel -->
  <rect x="36" y="36" width="440" height="440" rx="88" fill="none" stroke="rgba(255,255,255,0.06)" stroke-width="2" />

  <!-- Automotive Rear Light Bar Housing -->
  <rect x="56" y="210" width="400" height="92" rx="18" fill="#14171f" stroke="#2c3240" stroke-width="4" />
  
  <!-- Left Amber Indicator Segments -->
  <g filter="url(#glowAmber)">
    <rect x="74" y="226" width="18" height="60" rx="5" fill="url(#amberBar)" />
    <rect x="100" y="226" width="18" height="60" rx="5" fill="url(#amberBar)" />
    <rect x="126" y="226" width="18" height="60" rx="5" fill="url(#amberBar)" />
  </g>

  <!-- Central Red Running & Brake Segments -->
  <g filter="url(#glowRed)">
    <rect x="154" y="226" width="18" height="60" rx="5" fill="url(#redBar)" />
    <rect x="180" y="226" width="18" height="60" rx="5" fill="url(#redBar)" />
    <rect x="206" y="226" width="18" height="60" rx="5" fill="url(#redBar)" />
    <rect x="232" y="226" width="22" height="60" rx="5" fill="#ffffff" stroke="#ffcccc" stroke-width="2" />
    <rect x="258" y="226" width="22" height="60" rx="5" fill="#ffffff" stroke="#ffcccc" stroke-width="2" />
    <rect x="288" y="226" width="18" height="60" rx="5" fill="url(#redBar)" />
    <rect x="314" y="226" width="18" height="60" rx="5" fill="url(#redBar)" />
    <rect x="340" y="226" width="18" height="60" rx="5" fill="url(#redBar)" />
  </g>

  <!-- Right Amber Indicator Segments -->
  <g filter="url(#glowAmber)">
    <rect x="368" y="226" width="18" height="60" rx="5" fill="url(#amberBar)" />
    <rect x="394" y="226" width="18" height="60" rx="5" fill="url(#amberBar)" />
    <rect x="420" y="226" width="18" height="60" rx="5" fill="url(#amberBar)" />
  </g>

  <!-- Automotive Sport Accents Above & Below Bar -->
  <path d="M120 165 L392 165" stroke="rgba(255,255,255,0.12)" stroke-width="3" stroke-linecap="round" />
  <path d="M160 345 L352 345" stroke="rgba(255,0,0,0.4)" stroke-width="4" stroke-linecap="round" />

  <!-- Turn Indicator Arrows -->
  <path d="M100 152 L80 165 L100 178 Z" fill="#ff9900" opacity="0.85" />
  <path d="M412 152 L432 165 L412 178 Z" fill="#ff9900" opacity="0.85" />

  <!-- Center Hazard Triangle Badge -->
  <polygon points="256,134 274,166 238,166" fill="none" stroke="#ff3333" stroke-width="3.5" stroke-linejoin="round" />
  <polygon points="256,142 268,163 244,163" fill="#ff3333" opacity="0.8" />
</svg>

