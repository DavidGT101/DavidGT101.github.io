name: Tests

on:
  push:
    paths:
      - ".github/workflows/tests.yml"
      - "**/*.py"
      - "**/*.html"
      - "**/*.css"
      - "**/*.js"
      - "!log/**"
  pull_request:
    paths:
      - ".github/workflows/tests.yml"
      - "**/*.py"
      - "**/*.html"
      - "**/*.css"
      - "**/*.js"
      - "!log/**"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  selenium-smoke:
    runs-on: self-hosted
    defaults:
      run:
        shell: pwsh

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.x"
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          if (Test-Path requirements.txt) { python -m pip install -r requirements.txt }

      - name: Run Selenium smoke tests
        id: tests
        continue-on-error: true
        run: |
          New-Item -ItemType Directory -Force -Path log | Out-Null
          Get-ChildItem -Path log -Filter *.log -File -ErrorAction SilentlyContinue | Remove-Item -Force
          $sha = if ($env:GITHUB_SHA) { $env:GITHUB_SHA.Substring(0, [Math]::Min(7, $env:GITHUB_SHA.Length)) } else { "latest" }
          $logFile = "log/$sha.log"

          python selenium_taillight_smoke.py --headless --browsers chrome,firefox 2>&1 | Tee-Object -FilePath $logFile
          $testStatus = $LASTEXITCODE
          Add-Content -Path $logFile -Value "`nTest exit code: $testStatus"
          exit $testStatus

      - name: Commit latest test log
        if: always() && github.event_name == 'push'
        run: |
          git config --global --add safe.directory "*"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A log

          $diff = git diff --cached --name-only
          if (-not $diff) {
            Write-Host "No test log changes to commit."
            exit 0
          }

          $sha = if ($env:GITHUB_SHA) { $env:GITHUB_SHA.Substring(0, [Math]::Min(7, $env:GITHUB_SHA.Length)) } else { "latest" }
          git commit -m "ci: update test log for $sha [skip ci]"
          git push

      - name: Fail workflow when tests fail
        if: steps.tests.outcome == 'failure'
        run: exit 1
